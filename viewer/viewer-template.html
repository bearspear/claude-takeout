.prose strong { font-weight: 600; }
.prose hr { border: 0; border-top: 1px solid var(--line); margin: 24px 0; }
.prose blockquote { margin: 0 0 15px; padding-left: 16px; border-left: 3px solid var(--line-strong); color: var(--soft); }
.prose img { max-width: 100%; height: auto; border-radius: 8px; }
.prose :not(pre) > code { font: .84em/1.3 var(--mono); color: var(--tick); background: var(--tick-bg); border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px; overflow-wrap: anywhere; }
.no-image { font: 13px var(--sans); color: var(--mute); font-style: italic; }
.cite { line-height: 0; font-size: 1em; vertical-align: baseline; margin-left: 4px; white-space: nowrap; }
.cite a { display: inline-block; min-width: 18px; max-width: 160px; overflow: hidden; text-overflow: ellipsis; vertical-align: middle; padding: 0 7px; font: 500 11.5px/19px var(--sans); text-align: center; text-decoration: none; color: var(--mute); background: var(--card); border: 1px solid var(--line); border-radius: 7px; position: relative; top: -2px; }
.cite a:hover { color: var(--ink); background: var(--active); }
/* claude.ai's product cards: a carousel, a featured card, a comparison */
.products { margin: 12px 0 16px; }
.carousel-track { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; padding-bottom: 2px; }
.carousel-track::-webkit-scrollbar { display: none; }
.carousel-track > .product { flex: 0 0 min(330px, 85%); scroll-snap-align: start; }
.carousel-nav { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
.carousel-nav button { width: 28px; height: 28px; border: 1px solid var(--line); border-radius: 50%; background: var(--card); color: var(--soft); cursor: pointer; display: flex; align-items: center; justify-content: center; }
.carousel-nav button:disabled { opacity: .35; cursor: default; }
.carousel-nav .prev svg { transform: rotate(180deg); }
.carousel-nav svg { width: 14px; height: 14px; }
.carousel-dots { display: flex; gap: 6px; }
.carousel-dots span { width: 6px; height: 6px; border-radius: 50%; background: var(--line-strong); }
.carousel-dots span.on { background: var(--mute); }
.product { border: 1px solid var(--line); border-radius: 12px; background: var(--card); padding: 6px; display: flex; flex-direction: column; font-family: var(--sans); }
.product-pics { display: grid; grid-template-columns: 1.6fr 1fr; grid-template-rows: 1fr 1fr; gap: 3px; height: 200px; border-radius: 8px; overflow: hidden; }
.product.featured .product-pics { height: 200px; grid-template-columns: 1.5fr 1fr; }
.product-pics > :first-child { grid-row: span 2; }
.product-pics.n1 { grid-template-columns: 1fr; }
.product-pics .pic { position: relative; padding: 0; border: 0; background: var(--bub); cursor: zoom-in; overflow: hidden; display: flex; align-items: center; justify-content: center; color: var(--mute); font: 12px var(--sans); }
.product-pics .pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
.product-pics .pic.missing { cursor: default; }
.product-pics .pic .tile-site { position: absolute; right: 6px; bottom: 4px; font-size: 11px; color: #fff; text-shadow: 0 1px 3px rgba(0, 0, 0, .7); }
.product-body { padding: 10px 8px 4px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
.product-name { font-size: 15px; font-weight: 500; color: var(--ink); }
.product-blurb { font-size: 13px; line-height: 1.5; color: var(--soft); flex: 1; }
.product-price { font-size: 12.5px; color: var(--mute); margin-top: 4px; }
.compare { border: 1px solid var(--line); border-radius: 12px; background: var(--card); font-family: var(--sans); overflow-x: auto; }
.compare-row { display: grid; grid-auto-columns: minmax(160px, 1fr); grid-auto-flow: column; }
.compare-row + .compare-row { border-top: 1px solid var(--line); }
.compare-row > div { padding: 10px 14px; }
.compare-head .product-name { font-size: 15.5px; }
.compare-head .product-price { margin-top: 2px; }
.compare-label { display: block; font-size: 12.5px; color: var(--mute); margin-bottom: 3px; }
.compare-value { font-size: 14px; color: var(--ink); }

.table { overflow-x: auto; margin: 0 0 15px; }
.prose table { border-collapse: collapse; font-size: .92em; line-height: 1.45; min-width: 60%; }
.prose th { font-weight: 600; }
.prose th:not([align]) { text-align: left; }
.prose th, .prose td { padding: 7px 14px 7px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
.prose th { border-bottom-color: var(--line-strong); }
.prose tr:last-child td { border-bottom: 0; }
.prose td:last-child, .prose th:last-child { padding-right: 0; }

.katex { font-size: 1.08em; }
.katex-display { overflow-x: auto; overflow-y: hidden; margin: 0 0 15px; padding: 2px 0; }

/* Code */
.code { background: var(--code-bg); border: 1px solid var(--line); border-radius: 10px; margin: 0 0 15px; overflow: hidden; font-family: var(--sans); }
.code-head { display: flex; align-items: center; justify-content: space-between; min-height: 33px; padding: 3px 6px 3px 14px; background: var(--code-head); font-size: 12px; color: var(--mute); }
.copy { display: inline-flex; align-items: center; gap: 5px; border: 0; background: none; border-radius: 6px; padding: 3px 7px; font-size: 12px; color: var(--mute); cursor: pointer; }
.copy:hover { background: var(--hover); color: var(--ink); }
.copy svg.ic { width: 13px; height: 13px; }
.wrap { display: inline-flex; align-items: center; gap: 5px; border: 1px solid transparent; background: none; border-radius: 6px; padding: 2px 7px; font-size: 12px; color: var(--mute); cursor: pointer; }
.wrap:hover { background: var(--hover); color: var(--ink); }
.wrap[aria-pressed="true"] { background: var(--bub); border-color: var(--line); color: var(--ink); }
.wrap svg.ic { width: 13px; height: 13px; }
body.wrap-code .file-code { white-space: pre-wrap; overflow-wrap: anywhere; width: auto; }
.code pre { margin: 0; padding: 13px 14px; overflow-x: auto; }
.code code { font: 13px/1.55 var(--mono); color: var(--code-ink); }
.hljs-keyword, .hljs-selector-tag, .hljs-meta .hljs-keyword, .hljs-doctag { color: var(--hl-keyword); }
.hljs-string, .hljs-regexp, .hljs-addition, .hljs-char.escape_ { color: var(--hl-string); }
.hljs-comment, .hljs-quote { color: var(--hl-comment); font-style: italic; }
.hljs-number, .hljs-literal, .hljs-symbol, .hljs-attr, .hljs-attribute, .hljs-selector-attr, .hljs-selector-pseudo { color: var(--hl-number); }
.hljs-title, .hljs-section, .hljs-built_in, .hljs-selector-id, .hljs-selector-class, .hljs-link { color: var(--hl-title); }
.hljs-tag .hljs-name, .hljs-name, .hljs-deletion, .hljs-bullet, .hljs-variable, .hljs-template-variable { color: var(--hl-name); }
.hljs-type, .hljs-meta { color: var(--hl-type); }
.hljs-section, .hljs-strong { font-weight: 600; }
.hljs-emphasis { font-style: italic; }
.bubble .code { margin: 10px 0; max-width: 100%; }
.bubble .code:first-child { margin-top: 2px; }
.bubble .code:last-child { margin-bottom: 2px; }
.bubble .code pre { white-space: pre; }

/* Thought process and tool lines */
.line { font-family: var(--sans); margin: 0 0 2px; }
.prose + .line { margin-top: 15px; }
.line + .prose { margin-top: 16px; }
.line summary { display: inline-flex; align-items: center; gap: 7px; max-width: 100%; list-style: none; cursor: pointer; font-size: 13.5px; line-height: 1.45; color: var(--mute); border-radius: 7px; padding: 3px 7px 3px 0; }
.line summary::-webkit-details-marker { display: none; }
.line summary:hover { color: var(--ink); }
.line .label { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.line .gist { color: var(--faint); }
.line summary:hover .gist { color: inherit; }
.line .chev { width: 13px; height: 13px; transition: transform .14s; }
.line[open] > summary .chev { transform: rotate(90deg); }
.line .fail { color: var(--err); font-size: 12px; flex: none; }
.line-body { margin: 5px 0 12px 8px; padding: 2px 0 2px 15px; border-left: 2px solid var(--line); font-size: 13.5px; line-height: 1.6; color: var(--soft); }
.line-text { white-space: pre-wrap; overflow-wrap: anywhere; }
.line-step { margin: 0 0 6px; overflow-wrap: anywhere; }
.line-note { margin: 0; font-size: 12.5px; color: var(--mute); }
.tool-part + .tool-part { margin-top: 10px; }
.tool-part h4 { margin: 0 0 4px; font-size: 11.5px; font-weight: 500; color: var(--mute); }
.tool-part pre { margin: 0; padding: 9px 12px; background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px; font: 12.5px/1.5 var(--mono); color: var(--code-ink); max-height: 320px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; }
.tool-part.missing-image { font-size: 11.5px; color: var(--mute); }
.tool-part.bad pre { color: var(--err); }
.tool-images { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 12px; }
.line.steps > summary { display: flex; width: 100%; }
.line .target { color: var(--ink); margin-left: 4px; }
.line .step-link { color: var(--mute); text-decoration: underline; text-underline-offset: 2px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.line .step-link:hover { color: var(--ink); }
.bubble .typed a { color: #2f6fb3; text-decoration: underline; text-underline-offset: 2px; }
@media (prefers-color-scheme: dark) { .bubble .typed a { color: #8ab4f8; } }
.line .thumbs { margin-left: auto; display: inline-flex; align-items: center; gap: 3px; flex: none; }
.line .thumbs img { width: 18px; height: 22px; object-fit: cover; border-radius: 3px; border: 1px solid var(--line); }
.line .thumbs .more { font-size: 12px; color: var(--mute); margin-right: 3px; }
.steps-box { margin: 6px 0 14px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--card); }
.steps-box > * { margin: 0; padding: 6px 12px; }
.steps-box > * + * { border-top: 1px solid var(--line); }
.steps-box > .line > summary { display: flex; width: 100%; padding-right: 0; }
.steps-box > .line > .line-body { margin: 4px 0 8px 2px; }
.steps-box .line-body .tool-images img { max-height: 300px; }
.tool-images .tool-image { padding: 0; border: 0; background: none; cursor: zoom-in; border-radius: 8px; }
.tool-images .tool-image img { display: block; }
.tool-images .tool-image:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
.step-text { font-size: 13.5px; color: var(--soft); }
.diagram { position: relative; margin: 14px 0 16px; }
.diagram-open { display: block; width: 100%; padding: 0; border: 0; background: none; cursor: zoom-in; border-radius: 10px; }
.diagram-open:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
.diagram-open > img { display: block; width: 100%; height: auto; border-radius: 10px; }
.diagram-more { position: absolute; top: 6px; right: 6px; width: 28px; height: 24px; border: 1px solid var(--line); border-radius: 7px; background: var(--card); color: var(--mute); font-size: 15px; line-height: 1; cursor: pointer; opacity: 0; transition: opacity .12s; }
.diagram:hover .diagram-more, .diagram-more:focus-visible, .diagram-more[aria-expanded="true"] { opacity: 1; }
.diagram-menu { position: absolute; top: 34px; right: 6px; z-index: 5; display: flex; flex-direction: column; min-width: 180px; padding: 5px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 6px 20px rgba(0, 0, 0, .12); }
.diagram-menu[hidden] { display: none; }
.diagram-menu button { text-align: left; padding: 7px 10px; border: 0; border-radius: 6px; background: none; color: var(--ink); font: 13.5px var(--sans); cursor: pointer; }
.diagram-menu button:hover, .diagram-menu button:focus-visible { background: var(--hover); outline: none; }
.diagram-note { position: absolute; top: 9px; right: 42px; font: 12px var(--sans); color: var(--mute); }
.published { display: flex; align-items: center; gap: 7px; margin: 6px 0 12px; font-size: 13.5px; color: var(--mute); }
.published svg { width: 15px; height: 15px; flex: none; }
.published a { color: var(--ink); }
.page-link { display: flex; align-items: center; gap: 7px; margin: -6px 0 12px; font-size: 13px; color: var(--mute); }
.page-link svg { width: 14px; height: 14px; flex: none; }
.page-link a { color: var(--ink); }
.page-link a.open-artifact { padding: 2px 9px; border: 1px solid var(--line); border-radius: 7px; text-decoration: none; margin-right: 4px; }
.page-link a.open-artifact:hover { background: var(--hover); }
.step-text .prose { font-size: inherit; line-height: 1.55; font-family: var(--sans); }
.step-text .prose > :first-child { margin-top: 0; }
.step-text .prose > :last-child { margin-bottom: 0; }
.tool-images img { max-width: 100%; max-height: 420px; border-radius: 8px; border: 1px solid var(--line); }
.web-results { margin: 8px 0 14px; max-width: 736px; }
.web-mosaic { display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: 200px; gap: 3px; border-radius: 12px; overflow: hidden; }
.web-mosaic.n1 { grid-template-columns: 1fr; grid-auto-rows: 320px; }
.web-mosaic.n3 .tile:first-child { grid-row: span 2; }
.web-mosaic .tile { position: relative; padding: 0; border: 0; margin: 0; background: var(--card); cursor: zoom-in; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--ink); font: inherit; }
.web-mosaic .tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
.web-mosaic .tile:focus-visible { outline: 2px solid var(--acc); outline-offset: -2px; }
.web-mosaic .tile.not-saved { background: var(--bub); gap: 4px; padding: 12px; text-align: center; cursor: pointer; }
.tile-title { font-size: 13px; line-height: 1.35; overflow-wrap: anywhere; }
.tile-note { font-size: 12px; color: var(--mute); }
.tile-site { position: absolute; right: 8px; bottom: 6px; font-size: 11px; color: #fff; text-shadow: 0 1px 3px rgba(0, 0, 0, .7); max-width: 80%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile-more { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0, 0, 0, .45); color: #fff; font-size: 22px; font-weight: 500; }
.web-caption { text-align: right; font-size: 12px; color: var(--mute); margin-top: 6px; }
.veil.gallery { background: rgba(12, 12, 12, .97); }
.gallery-pop { position: fixed; inset: 0; display: flex; flex-direction: column; outline: none; }
.gallery-pop > .close { position: absolute; top: 12px; right: 14px; z-index: 1; background: none; border: 0; color: #ddd; cursor: pointer; padding: 6px; }
.gallery-pop > .close svg { width: 18px; height: 18px; }
.gallery-stage { flex: 1; min-height: 0; display: flex; padding: 56px 24px 12px; overflow: auto; }
.gallery-stage img { max-width: 100%; max-height: 100%; margin: auto; object-fit: contain; border-radius: 10px; background: #fff; }
.gallery-stage .file-missing { color: #ccc; margin: auto; }
.gallery-pop > .zoom-frame { flex: 1; min-height: 0; }
/* Zoom and pan: the box scrolls, the picture is centred by margin: auto so a larger one can scroll to every edge. */
.zoom-frame { position: relative; display: flex; flex-direction: column; min-width: 0; }
.zoom-frame > .zoom-box { flex: 1 1 auto; min-height: 0; overflow: auto; outline: none; user-select: none; -webkit-user-select: none; touch-action: pan-x pan-y; }
.zoom-frame > .zoom-box:focus-visible { box-shadow: inset 0 0 0 2px var(--acc); }
.zoom-box > img { max-width: none; max-height: none; flex: none; margin: auto; display: block; }
.zoom-box.zoom-all, .zoom-box.can-drag { touch-action: none; }
.zoom-box.can-drag { cursor: grab; }
.zoom-box.dragging { cursor: grabbing; }
.zoom-bar { position: absolute; right: 8px; bottom: 8px; z-index: 2; display: flex; align-items: center; gap: 2px; padding: 3px; border: 1px solid var(--line); border-radius: 9px; background: var(--card); color: var(--ink); font: 12.5px var(--sans); box-shadow: 0 2px 8px rgba(0, 0, 0, .15); opacity: 0; transition: opacity .12s; }
.zoom-bar[hidden] { display: none; }
.zoom-frame:hover > .zoom-bar, .zoom-frame:focus-within > .zoom-bar { opacity: 1; }
@media (hover: none) { .zoom-bar { opacity: 1; } }
.zoom-bar button { min-width: 28px; height: 26px; padding: 0 7px; border: 0; border-radius: 6px; background: none; color: inherit; font: inherit; cursor: pointer; }
.zoom-bar button:hover, .zoom-bar button:focus-visible { background: var(--hover); outline: none; }
.zoom-level { min-width: 42px; text-align: center; font-variant-numeric: tabular-nums; }
.gallery-foot { position: relative; display: flex; align-items: center; min-height: 64px; padding: 10px 20px 16px; color: #ddd; }
.gallery-info { display: flex; flex-direction: column; gap: 2px; max-width: 40%; font-size: 13px; }
.gallery-info .site { color: #999; font-size: 12px; }
.gallery-info .open { color: #9cc3ff; font-size: 12px; }
.gallery-nav { position: absolute; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 14px; font-size: 13px; }
.gallery-nav[hidden] { display: none; }
.gallery-nav button { background: none; border: 0; color: #ddd; cursor: pointer; padding: 4px; }
.gallery-nav button:disabled { opacity: .3; cursor: default; }
.gallery-nav .prev svg { transform: rotate(180deg); }
.gallery-nav svg { width: 16px; height: 16px; }
@media (max-width: 640px) { .web-mosaic { grid-auto-rows: 140px; } .gallery-info { max-width: 100%; } .gallery-foot { flex-direction: column; gap: 10px; align-items: flex-start; } .gallery-nav { position: static; transform: none; } }

/* Sources */
.sources { font-family: var(--sans); margin-top: 14px; padding-top: 10px; border-top: 1px solid var(--line); }
.sources h4 { margin: 0 0 5px; font-size: 12px; font-weight: 500; color: var(--mute); }
.sources ol { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 2px; }
.sources li { display: flex; gap: 7px; font-size: 13px; min-width: 0; }
.sources li span { color: var(--mute); flex: none; min-width: 14px; }
.sources a { color: var(--soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-decoration: none; }
.sources a:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 2px; }

/* A generated file in the message stream */
.art { display: flex; align-items: center; gap: 12px; width: 100%; max-width: 440px; text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 9px 14px 9px 10px; margin: 12px 0; font-family: var(--sans); cursor: pointer; }
.art:hover { border-color: var(--line-strong); }
.art.on { border-color: var(--acc); }
.art .tile { width: 36px; height: 36px; border-radius: 8px; background: var(--bub); color: var(--mute); display: flex; align-items: center; justify-content: center; flex: none; }
.art .txt { min-width: 0; display: flex; flex-direction: column; }
.art b { font-size: 14px; font-weight: 600; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.art small { font-size: 12px; line-height: 1.3; color: var(--mute); }
.art .flag { flex: none; margin-left: auto; padding: 2px 7px; border: 1px solid currentColor; border-radius: 999px; font-size: 11px; line-height: 1.3; color: var(--hl-number); white-space: nowrap; }
.file-note.flag-note { color: var(--hl-number); }
.art .flag.soft { color: inherit; opacity: .7; }

/* The file panel */
#panel { width: 43%; flex: none; display: flex; flex-direction: column; min-height: 0; background: var(--card); border-left: 1px solid var(--line); }
#panel[hidden] { display: none; }
#panel-head { height: 52px; flex: none; display: flex; align-items: center; gap: 6px; padding: 0 12px 0 16px; border-bottom: 1px solid var(--line); }
.panel-title { flex: 1 1 60px; min-width: 0; font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.panel-kind { flex: 0 1 auto; min-width: 0; font-size: 12px; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-right: 6px; }
.vers { display: flex; gap: 4px; flex: 0 1 auto; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.vers:empty { display: none; }
.tab, .ver, .close { flex: none; border: 1px solid var(--line); border-radius: 7px; background: none; padding: 2px 8px; font-size: 12px; line-height: 1.5; color: var(--mute); cursor: pointer; }
.tab:hover, .ver:hover, .close:hover { color: var(--ink); background: var(--hover); }
.tab.on, .ver.on { background: var(--bub); color: var(--ink); }
.close { display: flex; align-items: center; padding: 3px 5px; }
.close svg.ic { width: 13px; height: 13px; }
#panel-body { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: auto; }
#panel-body > .prose { padding: 20px 22px; }
.preview { flex: 1; min-height: 0; width: 100%; border: 0; display: block; background: #fff; }
.file-note { flex: none; padding: 8px 16px; font-size: 12.5px; line-height: 1.45; color: var(--soft); background: var(--bub); border-bottom: 1px solid var(--line); }
.file-code { flex: 1 0 auto; margin: 0; padding: 14px 16px; font: 12.5px/1.55 var(--mono); color: var(--code-ink); background: var(--code-bg); white-space: pre; width: max-content; min-width: 100%; }
/* Scrolls rather than #panel-body; its child centres with margin: auto, so a zoomed picture's top and left stay reachable */
.file-paper { flex: 1; min-height: 0; display: flex; overflow: auto; padding: 16px; background: var(--bub); }
.file-paper > .file-audio, .file-paper > .file-video { margin: auto; }
#panel-body > .zoom-frame, .pop-body > .zoom-frame { flex: 1; min-height: 0; }
/* A page's zoom: the frame is laid out at wrapper size ÷ zoom and scaled back, so the wrapper clips it. The bar has
   its own strip below the frame, so it never covers the page (a wide page's scrollbar end, a control in its corner). */
.page-zoom { --zoom-strip: 38px; position: relative; flex: 1; min-height: 0; overflow: hidden; background: #fff; padding-bottom: var(--zoom-strip); }
.page-zoom > .preview { position: absolute; left: 0; top: 0; width: calc(100% / var(--page-zoom, 1)); height: calc((100% - var(--zoom-strip)) / var(--page-zoom, 1)); flex: none; transform: scale(var(--page-zoom, 1)); transform-origin: 0 0; }
.page-zoom > .zoom-bar { left: 0; right: 0; bottom: 0; height: var(--zoom-strip); justify-content: flex-end; padding: 0 8px; border: 0; border-top: 1px solid var(--line); border-radius: 0; background: var(--bg); box-shadow: none; opacity: 1; }
.zoom-bar button:disabled { opacity: .4; cursor: default; background: none; }
.file-audio { width: min(420px, 100%); }
.file-video { max-width: 100%; max-height: 100%; border-radius: 6px; }
.file-image { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 6px; }
.file-image.svg-picture { background: #fff; }
.file-details { margin: auto; padding: 24px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; max-width: 340px; }
.file-details .tile { width: 44px; height: 44px; border-radius: 10px; background: var(--bub); color: var(--mute); display: flex; align-items: center; justify-content: center; margin-bottom: 4px; }
.file-path { font-size: 12px; color: var(--mute); overflow-wrap: anywhere; }
.file-details b { font-size: 14px; font-weight: 600; overflow-wrap: anywhere; }
.file-details small { font-size: 12px; color: var(--mute); }
.file-details p { margin: 8px 0 0; font-size: 13px; color: var(--mute); }
.file-open { margin-top: 10px; padding: 5px 12px; border: 1px solid var(--line-strong); border-radius: 8px; font-size: 13px; color: var(--ink); text-decoration: none; }
.file-open:hover { background: var(--hover); }
.file-missing, .file-loading { margin: auto; padding: 24px; font-size: 13.5px; color: var(--mute); text-align: center; }
/* Project instructions and files, each collapsed under the top bar */
#project { flex: none; border-bottom: 1px solid var(--line); background: var(--bg); padding: 0 20px; position: relative; z-index: 2; }
#project[hidden] { display: none; }
#project summary { display: flex; align-items: center; gap: 7px; list-style: none; cursor: pointer; padding: 7px 0; font-size: 13px; color: var(--mute); }
#project summary::-webkit-details-marker { display: none; }
#project summary:hover { color: var(--ink); }
#project .chev { width: 13px; height: 13px; transition: transform .14s; }
#project details[open] > summary .chev { transform: rotate(90deg); }
#project .instructions-text { max-height: 28vh; overflow-y: auto; padding: 2px 0 10px 20px; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13.5px; line-height: 1.5; color: var(--ink); }
#project .chips { justify-content: flex-start; padding: 2px 0 12px; max-height: 40vh; overflow-y: auto; }
button.chip { font: inherit; color: inherit; text-align: left; cursor: pointer; }
button.chip:hover { border-color: var(--line-strong); }

/* Files added to an archive: a filter over a folder tree, built as it opens */
.add-box { padding: 2px 0 12px; max-height: 40vh; overflow-y: auto; }
.add-filter { display: block; box-sizing: border-box; width: min(320px, 100%); margin: 0 0 8px; padding: 6px 10px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--card); color: var(--ink); font: 13px var(--sans); outline: none; }
.add-filter::placeholder { color: var(--mute); }
.add-filter:focus { border-color: var(--acc); }
.add-tree[hidden], .add-results[hidden] { display: none; }
.add-count { padding: 0 0 4px; font-size: 12px; color: var(--mute); }
.add-level .add-level { padding-left: 16px; }
#project .add-level summary { padding: 4px 6px; border-radius: 6px; color: var(--soft); font-size: 13px; line-height: 1.25; overflow-wrap: anywhere; }
#project .add-level summary:hover { background: var(--hover); color: var(--ink); }
.add-file { display: flex; align-items: center; gap: 7px; width: 100%; padding: 4px 6px; border: 0; border-radius: 6px; background: none; color: var(--soft); font: 13px/1.25 var(--sans); text-align: left; cursor: pointer; }
.add-file:hover { background: var(--hover); color: var(--ink); }
.add-file.on { background: var(--active); color: var(--ink); }
.add-file .ic { flex: none; width: 13px; height: 13px; color: var(--mute); }
.add-file span { min-width: 0; overflow-wrap: anywhere; }

/* A popup over the chat: uploads, pasted files and project files */
.veil { position: fixed; inset: 0; z-index: 20; background: rgba(40, 35, 25, .42); display: flex; align-items: center; justify-content: center; }
.pop { width: min(860px, 92vw); height: 82vh; background: var(--card); color: var(--ink); border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 12px 40px rgba(0, 0, 0, .25); }
.pop:focus { outline: none; }
.pop-head { height: 44px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 12px 0 16px; border-bottom: 1px solid var(--line); }
.pop-title { flex: 1; min-width: 0; font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pop-head .file-open { margin: 0; padding: 2px 8px; font-size: 12px; color: var(--mute); border-radius: 7px; border-color: var(--line); }
.pop-body { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: auto; }
/* Too narrow for both: the panel covers the chat and leaves the sidebar */
@media (max-width: 1100px) {
  #panel { position: fixed; top: 0; bottom: 0; right: 0; left: 272px; width: auto; z-index: 8; border-left: 1px solid var(--line); }
}

/* Phone: the sidebar becomes a drawer */
#scrim { display: none; position: fixed; inset: 0; background: rgba(20, 18, 12, .42); z-index: 9; }
@media (max-width: 760px) {
  #side { position: fixed; top: 0; bottom: 0; left: 0; width: min(290px, 84vw); z-index: 10; transform: translateX(-102%); transition: transform .18s ease; }
  body.drawer #side { transform: none; box-shadow: 0 8px 40px rgba(0, 0, 0, .28); }
  body.drawer #scrim { display: block; }
  #menu { display: block; }
  /* The menu button stays reachable over the Artifacts screen. */
  body.artifacts-on #top { display: flex; }
  body.artifacts-on #meta, body.artifacts-on #files-button, body.artifacts-on #files-menu { display: none; }
  #top { padding: 0 14px; gap: 8px; }
  #scroll { scrollbar-gutter: auto; }
  #panel { left: 0; border-left: 0; }
  #panel-head { height: auto; flex-wrap: wrap; padding: 8px 12px; }
  .panel-title { flex: 1 1 0; order: 1; }
  .panel-kind { display: none; }
  .close { order: 2; }
  .tab, .vers, #panel-head .copy, #panel-head .wrap { order: 3; }
  #chat { padding: 12px 12px 72px; }
  .prose { font-size: 16px; }
  .bubble { max-width: 90%; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
