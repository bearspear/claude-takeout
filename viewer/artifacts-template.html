* { box-sizing: border-box; }
html, body { margin: 0; }

.bar { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }

#search { width: 100%; font: inherit; font-size: 13px; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px 5px 29px; outline: none; }
#search::placeholder { color: var(--faint); }
#search:focus { border-color: var(--line-strong); box-shadow: 0 0 0 3px var(--hover); }
#search::-webkit-search-cancel-button { cursor: pointer; }
#grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
.card { display: flex; flex-direction: column; text-align: left; padding: 0; background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; cursor: pointer; transition: border-color .15s, box-shadow .15s; min-width: 0; }
.card:hover { border-color: var(--line-strong); box-shadow: 0 2px 8px rgba(0, 0, 0, .06); }
.pic { display: block; height: 124px; padding: 24px 24px 0; background: var(--pic); overflow: hidden; border-bottom: 1px solid var(--line); }
.pic img { display: block; width: 100%; min-height: 100%; object-fit: cover; object-position: top; background: #fff; border: 1px solid var(--page-line); border-bottom: 0; border-radius: 4px 4px 0 0; }
.tile { display: flex; align-items: center; justify-content: center; height: 100%; border-radius: 4px 4px 0 0; background: var(--tile-bg); color: var(--tile-ink); border: 1px solid var(--page-line); border-bottom: 0; }
.tile svg { width: 28px; height: 28px; }
.tile.docs { background: var(--docs-bg); color: var(--docs-ink); }
.tile.design { background: var(--design-bg); color: var(--design-ink); }
.info { display: block; padding: 10px 12px 11px; min-width: 0; }
.title { display: block; font-size: 13px; line-height: 18px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sub { display: flex; align-items: center; gap: 6px; margin-top: 2px; font-size: 11px; line-height: 16px; color: var(--mute); }
.sub .dot { color: var(--faint); }
.sub time:empty, .sub time:empty + .dot { display: none; }
.globe { margin-left: auto; width: 13px; height: 13px; color: var(--mute); flex: none; }
#empty { color: var(--mute); font-size: 14px; text-align: center; padding: 64px 0; margin: 0; }
@media (max-width: 560px) {

  .bar { flex-wrap: wrap; }

  #grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
